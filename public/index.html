<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Video Chat</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
        h1 { color: #333; }
        .video-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 20px; }
        video { width: 100%; max-width: 450px; height: 350px; background: #000; border-radius: 8px; border: 2px solid #ccc; }
    </style>
</head>
<body>
    <h1>WebRTC Video Chat</h1>
    <div class="video-container">
        <div>
            <h3>My Video</h3>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div>
            <h3>Partner Video</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <!-- Required Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/script.js"></script>
</body>
</html>
