<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Encrypted WebRTC Chat & Video</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 20px; background-color: #f4f4f9; }
        h2 { color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        video { width: 45%; max-width: 220px; margin: 5px; background: black; border: 2px solid #ccc; border-radius: 6px; }
        #chat-container { margin-top: 15px; text-align: left; }
        #messages { height: 180px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fafafa; border-radius: 5px; font-size: 14px; }
        .input-group { margin-bottom: 12px; }
        input { padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        #room-password, #message-input { width: 100%; }
        #send-btn { padding: 10px 15px; width: 100%; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
        #send-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Secure Encrypted Chat</h2>

        <!-- Password Input for Auto-Login/Encryption -->
        <div class="input-group">
            <input type="password" id="room-password" placeholder="Enter Shared Secret Password..." />
        </div>

        <!-- Video Feeds -->
        <div>
            <video id="localVideo" autoplay playsinline muted></video>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>

        <!-- Chat Box -->
        <div id="chat-container">
            <div id="messages"></div>
            <div class="input-group">
                <input type="text" id="message-input" placeholder="Type a secure message..." />
            </div>
            <button id="send-btn">Send Secure Message</button>
        </div>
    </div>

    <!-- Include CryptoJS for AES encryption -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <!-- Include Socket.io client script -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
